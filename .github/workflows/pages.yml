name: Publish site
on:
  schedule:
    - cron: "4,19,34,49 * * * *"  # every 15 minutes, off the busy :00/:30 marks; GitHub still often delays or skips scheduled runs
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false  # never cut a deployment short; a newer run waits for the running one
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # runs are never cancelled, so a stuck one must not block the next for hours
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: python3 test_generate.py
        if: github.event_name != 'schedule'  # the tests use fixed data, so running them hourly would catch nothing new
      - run: python3 generate.py
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
