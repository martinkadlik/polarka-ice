name: Publish site
on:
  schedule:
    - cron: "7 * * * *"  # hourly; minute 7, not 0, when GitHub is busiest
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 test_generate.py
        if: github.event_name != 'schedule'  # the tests use fixed data, so running them hourly would catch nothing new
      - run: python3 generate.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
