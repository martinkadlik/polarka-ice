name: Publish site
on:
  schedule:
    - cron: "4,19,34,49 * * * *"  # every 15 minutes, off the busy :00/:30 marks; GitHub still often delays or skips scheduled runs
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - run: python3 test_generate.py
        if: github.event_name != 'schedule'  # the tests use fixed data, so running them hourly would catch nothing new
      - run: python3 generate.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
